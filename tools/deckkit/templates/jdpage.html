<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>$title</title>
<style>
@page { size: A4; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 210mm; height: 296mm; overflow: hidden; }
body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: #1c1f23; font-size: 9.5pt; line-height: 1.35; }
.page { width: 210mm; height: 296mm; overflow: hidden; padding: 12mm 14mm 10mm; display: flex; flex-direction: column; gap: 4.5mm; }
.brandbar { display: flex; align-items: center; gap: 3mm; border-bottom: 0.6mm solid $color; padding-bottom: 2.5mm; }
.brandbar img { height: 8mm; max-width: 30mm; object-fit: contain; }
.brandbar .name { font-weight: 700; font-size: 10pt; color: $color; letter-spacing: .04em; text-transform: uppercase; }
.kicker { font-size: 8pt; color: #5b6470; text-transform: uppercase; letter-spacing: .08em; }
h1 { font-size: 17pt; line-height: 1.2; color: #111; overflow-wrap: anywhere; }
h2 { font-size: 9pt; text-transform: uppercase; letter-spacing: .08em; color: $color; margin-bottom: 1.5mm; }
.problem { font-size: 10pt; overflow-wrap: anywhere; }
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 1.5mm 0; }
.step { background: $tint; border: 0.3mm solid $color; border-radius: 1.5mm; padding: 1.8mm 2.2mm; font-size: 8.5pt; flex: 0 1 auto; max-width: 56mm; overflow-wrap: anywhere; }
.step b { color: $color; margin-right: 1mm; }
.arrow { align-self: center; padding: 0 1.4mm; color: $color; font-weight: 700; }
.phases { display: flex; gap: 3mm; }
.phase { flex: 1 1 0; border-top: 1mm solid $color; background: #f6f7f8; padding: 2mm 2.5mm; min-width: 0; overflow-wrap: anywhere; }
.phase .pn { font-weight: 700; font-size: 10pt; }
.phase .pd { font-size: 8pt; color: $color; font-weight: 700; margin: .5mm 0 1mm; }
table { width: 100%; border-collapse: collapse; font-size: 8.5pt; }
th { text-align: left; background: $color; color: #fff; padding: 1.3mm 2mm; font-size: 8pt; }
td { border-bottom: 0.2mm solid #d5d9de; padding: 1.3mm 2mm; vertical-align: top; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 2.5mm; }
.chip { border: 0.3mm solid $color; border-radius: 3mm; padding: 1.5mm 3mm; max-width: 100%; overflow-wrap: anywhere; }
.chip .num { font-size: 13pt; font-weight: 700; color: $color; }
.chip .lab { font-size: 8.5pt; }
.chip .src { font-size: 7pt; color: #5b6470; }
.cta { margin-top: auto; background: $color; color: #fff; border-radius: 2mm; padding: 4mm 5mm; font-size: 11pt; font-weight: 600; overflow-wrap: anywhere; }
</style></head><body><div class="page">
<div class="brandbar">$logo<span class="name">$brand_name</span></div>
<div><div class="kicker">How I would build your system</div><h1>$title</h1></div>
<div><h2>The problem</h2><p class="problem">$problem</p></div>
<div><h2>How it flows</h2><div class="flow">$flow</div></div>
<div><h2>Three phases</h2><div class="phases">$phases</div></div>
<div><h2>Risks and how I handle them</h2><table><tr><th style="width:45%">Risk</th><th>Mitigation</th></tr>$risks</table></div>
<div><h2>Proof</h2><div class="chips">$proof</div></div>
<div class="cta">$cta</div>
</div></body></html>
