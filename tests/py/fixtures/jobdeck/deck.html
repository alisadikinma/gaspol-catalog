<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#fff;font-family:sans-serif}
.slide{width:1920px;height:1080px;position:relative;overflow:hidden}
#s1{display:block;background:#eef}
#s2{display:grid;grid-template-columns:1fr 1fr;gap:40px;background:#efe}
.pic{width:300px;height:300px}
</style></head>
<body>
<div id="s1" class="slide cover">
  <p class="eye" data-job="cover-eye" data-job-max="40">Generic eyebrow</p>
  <h1 data-job="cover-head" data-job-max="60">Original <em>cover</em> head</h1>
  <p data-job="cover-sub">Original sub</p>
  <img class="pic" src="img/dot.png" alt="">
</div>
<div id="s2" class="slide">
  <h2 data-job="cta-head" data-job-max="50">Original CTA head</h2>
  <p data-job="cta-sub">Original CTA sub</p>
</div>
</body></html>
